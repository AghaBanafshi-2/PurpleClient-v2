name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'

      - name: Extract source zip
        run: |
          unzip -o PurpleClient-1_8_9-Final__1__1.zip -d .

      - name: Build
        run: gradle build --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Find built JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*sources*" ! -name "*deobf*" | head -1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleClient-${{ github.ref_name }}
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PurpleClient ${{ github.ref_name }}
          body: |
            ## PurpleClient ${{ github.ref_name }}
            Minecraft 1.8.9 Forge Mod
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
